<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎉</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    .card {
        background: rgba(255, 255, 255, 0.9);
        padding: 40px 60px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        animation: popIn 1.2s ease-out;
    }

    h1 {
        font-size: 3em;
        color: #ff4b5c;
        animation: glow 2s infinite alternate;
    }

    p {
        font-size: 1.3em;
        color: #444;
        margin-top: 15px;
    }

    .heart {
        font-size: 3em;
        animation: beat 1s infinite;
        margin-top: 20px;
    }

    @keyframes popIn {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes glow {
        from { text-shadow: 0 0 5px #ff4b5c; }
        to { text-shadow: 0 0 20px #ff4b5c; }
    }

    @keyframes beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }

    .balloon {
        position: absolute;
        bottom: -100px;
        font-size: 2em;
        animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-120vh); opacity: 0; }
    }
</style>
</head>
<body>

<div class="card">
    <h1>Happy Birthday Asna 🎂</h1>
    <p>To someone who makes every day brighter ✨</p>
    <p>May your smile stay forever and your dreams come true 💫</p>
    <div class="heart">❤️</div>
    <p style="margin-top:25px;font-size:1em;color:#666;">
        – From someone who truly cares
    </p>
</div>

<script>
    const balloons = ["🎈","🎉","🎀","💖"];
    setInterval(() => {
        const b = document.createElement("div");
        b.className = "balloon";
        b.innerText = balloons[Math.floor(Math.random()*balloons.length)];
        b.style.left = Math.random() * 100 + "vw";
        b.style.animationDuration = (4 + Math.random()*3) + "s";
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 7000);
    }, 500);
</script>

</body>
</html>
